services:
  - type: web
    name: finai
    runtime: python
    plan: free
    rootDir: Finance-Management-main
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /tmp/finai-data
      - key: DATABASE_URL
        value: sqlite:////tmp/finai-data/finai.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
